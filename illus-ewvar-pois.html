<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poisson Derivation Tree - Cumulative</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; color: #333; padding: 20px; line-height: 1.5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        /* Cumulative Proof Style */
        #proof-board { background: #2c3e50; color: #ecf0f1; padding: 20px; border-radius: 8px; margin-bottom: 25px; min-height: 50px; transition: all 0.5s ease; }
        #proof-board h4 { margin-top: 0; color: #3498db; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .proof-line { margin: 10px 0; font-size: 1.1rem; border-left: 3px solid #3498db; padding-left: 10px; animation: fadeIn 0.5s; }

        .branch-box { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .branch { background: #fff; border: 2px solid #ddd; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.2s; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .branch:hover { border-color: #3498db; background: #f9fcff; }
        .branch.correct { border-color: #27ae60; background: #f0fff4; }
        .branch.wrong { border-color: #e74c3c; background: #fff5f5; }

        .feedback { padding: 15px; border-radius: 8px; margin: 15px 0; display: none; border: 1px solid; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 20px; }
        #progress { height: 100%; background: #3498db; width: 0%; transition: 0.4s; }
        
        button { background: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Deriving Poisson Mean & Variance</h1>
    <div class="progress-bar"><div id="progress"></div></div>

    <!-- The Accumulating Proof -->
    <div id="proof-board" class="hidden">
        <h4>Current Derivation:</h4>
        <div id="accumulated-steps"></div>
    </div>

    <div id="intro">
        <p>Step through the proof for $X \sim \text{Pois}(\lambda)$. Identify the correct mathematical transitions to build the complete derivation.</p>
        <button onclick="start()">Start Derivation</button>
    </div>

    <div id="game-area" class="hidden">
        <p id="step-desc" style="font-weight: bold;"></p>
        <div class="branch-box">
            <div id="choice-a" class="branch" onclick="check('a')"></div>
            <div id="choice-b" class="branch" onclick="check('b')"></div>
        </div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="hidden" onclick="next()">Next Step</button>
    </div>

    <div id="completion" class="hidden" style="text-align: center;">
        <h2 style="color: #27ae60;">Proof Complete!</h2>
        <button onclick="location.reload()">Start Over</button>
    </div>
</div>

<script>
    const steps = [
        {
            desc: "Begin with the definition of Expectation $E[X]$:",
            a: "$E[X] = \\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            b: "$E[X] = \\sum_{k=0}^{\\infty} \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            correct: "a",
            error: "Incorrect. The sum $\\sum P(X=k)$ equals 1. For expectation, you need the weighted sum $\\sum k \\cdot P(X=k)$.",
            proof: "$E[X] = \\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}$"
        },
        {
            desc: "The $k=0$ term is zero. For $k \\ge 1$, simplify the $k/k!$ term:",
            a: "$= e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^k}{(k-1)!}$",
            b: "$= e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^{k-1}}{k!}$",
            correct: "a",
            error: "Note that $k! = k(k-1)!$. Dividing by $k$ simplifies the factorial to $(k-1)!$.",
            proof: "$= e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^k}{(k-1)!}$"
        },
        {
            desc: "Factor out $\\lambda$ to align the power with the factorial index:",
            a: "$= \\lambda e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^{k-1}}{(k-1)!}$",
            b: "$= \\lambda e^{-\\lambda} \\sum_{k=0}^{\\infty} \\frac{\\lambda^{k}}{(k-1)!}$",
            correct: "a",
            error: "The index $k$ still starts at 1. We haven't substituted the variable yet, just pulled $\\lambda^1$ out.",
            proof: "$= \\lambda e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^{k-1}}{(k-1)!}$"
        },
        {
            desc: "Let $j = k-1$. Since $\\sum_{j=0}^{\\infty} \\frac{\\lambda^j}{j!} = e^\\lambda$, we get:",
            a: "$= \\lambda e^{-\\lambda} e^{\\lambda} = \\lambda$",
            b: "$= e^{-\\lambda} e^{\\lambda} = 1$",
            correct: "a",
            error: "You forgot the $\\lambda$ sitting outside the summation. $e^{-\\lambda} e^\\lambda$ cancels to 1, leaving $\\lambda$.",
            proof: "$E[X] = \\lambda \\quad \\checkmark$"
        },
        {
            desc: "Now for Variance. First, find the second factorial moment $E[X(X-1)]$. Why?",
            a: "Because $\\frac{k(k-1)}{k!}$ simplifies directly to $\\frac{1}{(k-2)!}$",
            b: "Because $E[X(X-1)]$ is equivalent to the Variance.",
            correct: "a",
            error: "Variance is $E[X^2] - (E[X])^2$. We use $X(X-1)$ because it makes the series expansion easier.",
            proof: "$E[X(X-1)] = \\sum_{k=2}^{\\infty} k(k-1) \\frac{\\lambda^k e^{-\\lambda}}{k!}$"
        },
        {
            desc: "Following the same logic (factoring out $\\lambda^2$ and shifting index), we find:",
            a: "$E[X(X-1)] = \\lambda^2$",
            b: "$E[X(X-1)] = \\lambda$",
            correct: "a",
            error: "Two factors of $\\lambda$ must be pulled out to leave $\\lambda^{k-2}$ inside, so the result is $\\lambda^2$.",
            proof: "$E[X(X-1)] = \\lambda^2$"
        },
        {
            desc: "Finally, calculate $Var(X) = E[X(X-1)] + E[X] - (E[X])^2$:",
            a: "$Var(X) = \\lambda^2 + \\lambda - \\lambda^2 = \\lambda$",
            b: "$Var(X) = \\lambda^2 - \\lambda^2 = 0$",
            correct: "a",
            error: "You missed the $+E[X]$ part. Remember $E[X^2] = E[X(X-1)] + E[X]$.",
            proof: "$Var(X) = (\\lambda^2 + \\lambda) - \\lambda^2 = \\lambda \\quad \\checkmark$"
        }
    ];

    let current = 0;

    function start() {
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        document.getElementById('proof-board').classList.remove('hidden');
        render();
    }

    function render() {
        const s = steps[current];
        document.getElementById('step-desc').innerHTML = s.desc;
        document.getElementById('choice-a').innerHTML = s.a;
        document.getElementById('choice-b').innerHTML = s.b;
        document.getElementById('choice-a').className = 'branch';
        document.getElementById('choice-b').className = 'branch';
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        MathJax.typesetPromise();
    }

    function check(choice) {
        const s = steps[current];
        const fb = document.getElementById('feedback');
        const el = document.getElementById('choice-' + choice);
        
        fb.style.display = 'block';
        if (choice === s.correct) {
            el.className = 'branch correct';
            fb.innerHTML = "<strong>Correct!</strong> Moving to next step.";
            fb.style.color = "#27ae60"; fb.style.borderColor = "#27ae60";
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            el.className = 'branch wrong';
            fb.innerHTML = "<strong>Mistake:</strong> " + s.error;
            fb.style.color = "#c0392b"; fb.style.borderColor = "#e74c3c";
        }
        // Force MathJax to render the feedback content immediately
        MathJax.typesetPromise([fb]);
    }

    function next() {
        // Add correct step to proof board
        const board = document.getElementById('accumulated-steps');
        const newLine = document.createElement('div');
        newLine.className = 'proof-line';
        newLine.innerHTML = steps[current].proof;
        board.appendChild(newLine);

        current++;
        if (current < steps.length) {
            render();
        } else {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('completion').classList.remove('hidden');
            document.getElementById('progress').style.width = "100%";
        }
        MathJax.typesetPromise([board]);
        document.getElementById('progress').style.width = (current / steps.length * 100) + "%";
    }
</script>
</body>
</html>
