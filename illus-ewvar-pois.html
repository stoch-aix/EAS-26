<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poisson Proof: Step-by-Step Tree</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; color: #2d3436; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #proof-board { background: #2d3436; color: #dfe6e9; padding: 25px; border-radius: 12px; margin-bottom: 30px; border-left: 6px solid #0984e3; }
        #proof-board h4 { margin: 0 0 15px 0; color: #74b9ff; text-transform: uppercase; letter-spacing: 1px; }
        .proof-line { margin: 8px 0; font-size: 1.15rem; animation: slideIn 0.4s ease-out; }
        .step-card { border: 2px solid #dfe6e9; border-radius: 12px; padding: 20px; background: #fff; }
        .branch-box { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .branch { background: #fff; border: 2px solid #ced4da; padding: 25px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 120px; }
        .branch:hover { border-color: #0984e3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .branch.correct { border-color: #27ae60; background: #eafaf1; }
        .branch.wrong { border-color: #e74c3c; background: #fff5f5; }
        .feedback { padding: 15px; border-radius: 8px; margin: 15px 0; display: none; border-width: 1px; border-style: solid; font-weight: 500; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 25px; }
        #progress { height: 100%; background: #0984e3; width: 0%; transition: 0.5s; }
        button { background: #0984e3; color: white; border: none; padding: 12px 28px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .hidden { display: none; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Poisson Distribution Proof Tree</h1>
    <div class="progress-bar"><div id="progress"></div></div>

    <div id="proof-board" class="hidden">
        <h4>Accumulated Derivation</h4>
        <div id="accumulated-steps"></div>
    </div>

    <div id="intro" style="text-align: center;">
        <p>Build the proof for $E[X]$ and $Var(X)$ by choosing the correct mathematical logic at each branch.</p>
        <button onclick="start()">Begin Interactive Proof</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="step-card">
            <p id="step-desc" style="font-size: 1.1rem; margin-top: 0;"></p>
            <div class="branch-box">
                <div id="choice-0" class="branch" onclick="check(0)"></div>
                <div id="choice-1" class="branch" onclick="check(1)"></div>
            </div>
            <div id="feedback" class="feedback"></div>
            <div style="text-align: right;">
                <button id="next-btn" class="hidden" onclick="next()">Confirm & Continue →</button>
            </div>
        </div>
    </div>

    <div id="completion" class="hidden" style="text-align: center;">
        <h2 style="color: #27ae60;">$\blacksquare$ Proof Finalized</h2>
        <p>You have successfully derived both the Mean and the Variance!</p>
        <button onclick="location.reload()">Reset Tree</button>
    </div>
</div>

<script>
    const steps = [
        {
            desc: "1. Define the expectation $E[X]$ for the Poisson PMF:",
            correct: "$E[X] = \\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            wrong: "$E[X] = \\sum_{k=0}^{\\infty} \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            error: "The sum of probabilities $\\sum P(X=k)$ is always $1$. For the mean, we must sum $\\sum k P(X=k)$.",
            proof: "$E[X] = \\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}$"
        },
        {
            desc: "2. Simplify the term $k/k!$ for $k \\ge 1$:",
            correct: "$E[X] = e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^k}{(k-1)!}$",
            wrong: "$E[X] = e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^{k-1}}{k!}$",
            error: "The identity $\\frac{k}{k!} = \\frac{1}{(k-1)!}$ simplifies the denominator, not the power of $\\lambda$.",
            proof: "$= e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^k}{(k-1)!}$"
        },
        {
            desc: "3. Factor out $\\lambda$ and evaluate the sum using $\\sum_{j=0}^{\\infty} \\frac{\\lambda^j}{j!} = e^\\lambda$:",
            correct: "$= \\lambda e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^{k-1}}{(k-1)!} = \\lambda$",
            wrong: "$= e^{-\\lambda} \\sum_{k=1}^{\\infty} \\frac{\\lambda^{k-1}}{(k-1)!} = 1$",
            error: "To make the power of $\\lambda$ match $(k-1)!$, you must pull one $\\lambda$ outside the sum. Thus, the result is $\\lambda$.",
            proof: "$E[X] = \\lambda \\quad \\text{(Mean Verified)}$"
        },
        {
            desc: "4. To find $Var(X)$, we first need $E[X^2]$. Define the second moment:",
            correct: "$E[X^2] = \\sum_{k=0}^{\\infty} k^2 \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            wrong: "$E[X^2] = \\left(\\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}\\right)^2$",
            error: "The expectation of the square $E[X^2]$ is not the same as the square of the expectation $(E[X])^2$.",
            proof: "$E[X^2] = \\sum_{k=0}^{\\infty} k^2 \\frac{\\lambda^k e^{-\\lambda}}{k!}$"
        },
        {
            desc: "5. Use the identity $k^2 = k(k-1) + k$ to split the sum:",
            correct: "$E[X^2] = \\sum_{k=0}^{\\infty} k(k-1) \\frac{\\lambda^k e^{-\\lambda}}{k!} + \\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            wrong: "$E[X^2] = \\sum_{k=0}^{\\infty} k(k+1) \\frac{\\lambda^k e^{-\\lambda}}{k!} - \\sum_{k=0}^{\\infty} k \\frac{\\lambda^k e^{-\\lambda}}{k!}$",
            error: "We use $k(k-1)+k$ because $k(k-1)$ allows us to cancel terms in $k! = k(k-1)(k-2)!$.",
            proof: "$= \\sum_{k=2}^{\\infty} \\frac{k(k-1)\\lambda^k e^{-\\lambda}}{k!} + E[X]$"
        },
        {
            desc: "6. Simplify the first term by canceling $k(k-1)$ and factoring $\\lambda^2$:",
            correct: "$= \\lambda^2 e^{-\\lambda} \\sum_{k=2}^{\\infty} \\frac{\\lambda^{k-2}}{(k-2)!} + \\lambda$",
            wrong: "$= \\lambda e^{-\\lambda} \\sum_{k=2}^{\\infty} \\frac{\\lambda^{k-1}}{(k-2)!} + \\lambda$",
            error: "To match the $(k-2)!$ denominator, you must factor out $\\lambda^2$ so the power becomes $k-2$.",
            proof: "$= \\lambda^2 e^{-\\lambda}(e^{\\lambda}) + \\lambda$"
        },
        {
            desc: "7. Finalize $E[X^2]$ calculation:",
            correct: "$E[X^2] = \\lambda^2 + \\lambda$",
            wrong: "$E[X^2] = \\lambda^2 + 1$",
            error: "The second term in our split was $E[X]$, which we already proved is $\\lambda$.",
            proof: "$E[X^2] = \\lambda^2 + \\lambda$"
        },
        {
            desc: "8. Finally, compute $Var(X) = E[X^2] - (E[X])^2$:",
            correct: "$Var(X) = (\\lambda^2 + \\lambda) - \\lambda^2 = \\lambda$",
            wrong: "$Var(X) = (\\lambda^2 + \\lambda) - \\lambda = \\lambda^2$",
            error: "You must subtract $(E[X])^2$, which is $\\lambda^2$, not just $\\lambda$.",
            proof: "$Var(X) = \\lambda \\quad \\text{(Variance Verified)}$"
        }
    ];

    let current = 0;
    let correctPos = 0; // 0 for left, 1 for right

    function start() {
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        document.getElementById('proof-board').classList.remove('hidden');
        render();
    }

    function render() {
        const s = steps[current];
        correctPos = Math.floor(Math.random() * 2);
        
        document.getElementById('step-desc').innerHTML = s.desc;
        document.getElementById('choice-' + correctPos).innerHTML = s.correct;
        document.getElementById('choice-' + (1 - correctPos)).innerHTML = s.wrong;
        
        // Reset UI
        document.querySelectorAll('.branch').forEach(el => el.className = 'branch');
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        MathJax.typesetPromise();
    }

    function check(index) {
        const s = steps[current];
        const fb = document.getElementById('feedback');
        const selected = document.getElementById('choice-' + index);
        
        fb.style.display = 'block';
        if (index === correctPos) {
            selected.className = 'branch correct';
            fb.innerHTML = "✓ <strong>Correct!</strong> Ready to append to the proof.";
            fb.style.color = "#27ae60"; fb.style.borderColor = "#2ecc71"; fb.style.backgroundColor = "#eafaf1";
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            selected.className = 'branch wrong';
            fb.innerHTML = "✗ <strong>Mistake:</strong> " + s.error;
            fb.style.color = "#c0392b"; fb.style.borderColor = "#e74c3c"; fb.style.backgroundColor = "#fff5f5";
        }
        MathJax.typesetPromise([fb]);
    }

    function next() {
        const board = document.getElementById('accumulated-steps');
        const newLine = document.createElement('div');
        newLine.className = 'proof-line';
        newLine.innerHTML = steps[current].proof;
        board.appendChild(newLine);

        current++;
        if (current < steps.length) {
            render();
        } else {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('completion').classList.remove('hidden');
        }
        
        MathJax.typesetPromise([board]);
        document.getElementById('progress').style.width = (current / steps.length * 100) + "%";
    }
</script>
</body>
</html>
