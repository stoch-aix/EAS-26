<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Expectation Proof Tree</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; color: #2d3436; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #proof-board { background: #2d3436; color: #dfe6e9; padding: 25px; border-radius: 12px; margin-bottom: 30px; border-left: 6px solid #0984e3; }
        #proof-board h4 { margin: 0 0 15px 0; color: #74b9ff; text-transform: uppercase; letter-spacing: 1px; }
        .proof-line { margin: 8px 0; font-size: 1.1rem; animation: slideIn 0.4s ease-out; }
        .step-card { border: 2px solid #dfe6e9; border-radius: 12px; padding: 20px; background: #fff; }
        .branch-box { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .branch { background: #fff; border: 2px solid #ced4da; padding: 25px; border-radius: 10px; cursor: pointer; transition: 0.3s; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 120px; }
        .branch:hover { border-color: #0984e3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .branch.correct { border-color: #27ae60; background: #eafaf1; }
        .branch.wrong { border-color: #e74c3c; background: #fff5f5; }
        .feedback { padding: 15px; border-radius: 8px; margin: 15px 0; display: none; border-width: 1px; border-style: solid; font-weight: 500; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 25px; }
        #progress { height: 100%; background: #0984e3; width: 0%; transition: 0.5s; }
        button { background: #0984e3; color: white; border: none; padding: 12px 28px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .hidden { display: none; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Conditional Expectation Proof Tree</h1>
    <div class="progress-bar"><div id="progress"></div></div>

    <div id="proof-board" class="hidden">
        <h4>Accumulated Derivation</h4>
        <div id="accumulated-steps"></div>
    </div>

    <div id="intro" style="text-align: center;">
        <p>Derive the conditional expectation $E[X|Y]$ where $X \mid Y \sim Exp(Y)$ and $Y \sim \chi^2(1)$, then evaluate $E[X|Y=2]$.</p>
        <button onclick="start()">Begin Interactive Proof</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="step-card">
            <p id="step-desc" style="font-size: 1.1rem; margin-top: 0;"></p>
            <div class="branch-box">
                <div id="choice-0" class="branch" onclick="check(0)"></div>
                <div id="choice-1" class="branch" onclick="check(1)"></div>
            </div>
            <div id="feedback" class="feedback"></div>
            <div style="text-align: right;">
                <button id="next-btn" class="hidden" onclick="next()">Confirm & Continue →</button>
            </div>
        </div>
    </div>

    <div id="completion" class="hidden" style="text-align: center;">
        <h2 style="color: #27ae60;">$\blacksquare$ Derivation Finalized</h2>
        <p>You have successfully derived and exemplified the conditional expectation!</p>
        <button onclick="location.reload()">Reset Tree</button>
    </div>
</div>

<script>
    const steps = [
        {
            desc: "1. Express the joint density function $f_{X,Y}(x,y)$ using the product rule $f_{X,Y}(x,y) = f_{X|Y}(x|y) f_Y(y)$ for $x > 0, y > 0$:",
            correct: "$f_{X,Y}(x,y) = y e^{-yx} \\cdot f_Y(y)$",
            wrong: "$f_{X,Y}(x,y) = \\frac{1}{y} e^{-x/y} \\cdot f_Y(y)$",
            error: "The conditional law is $X \\mid Y \\sim Exp(Y)$, which yields the conditional density $f_{X|Y}(x|y) = y e^{-yx}$.",
            proof: "$f_{X,Y}(x,y) = f_{X|Y}(x|y) f_Y(y) = y e^{-yx} f_Y(y)$"
        },
        {
            desc: "2. Derive the conditional density $f_{X|Y}(x|y)$ back from the joint and marginal density functions via definition:",
            correct: "$f_{X|Y}(x|y) = \\frac{f_{X,Y}(x,y)}{f_Y(y)} = \\frac{y e^{-yx} f_Y(y)}{f_Y(y)} = y e^{-yx}$",
            wrong: "$f_{X|Y}(x|y) = \\frac{f_Y(y)}{f_{X,Y}(x,y)} = \\frac{f_Y(y)}{y e^{-yx} f_Y(y)} = \\frac{1}{y} e^{yx}$",
            error: "By definition, the conditional density is the joint density divided by the marginal density of the conditioning variable: $f_{X|Y}(x|y) = \\frac{f_{X,Y}(x,y)}{f_Y(y)}$.",
            proof: "$f_{X|Y}(x|y) = \\frac{f_{X,Y}(x,y)}{f_Y(y)} = y e^{-yx}$"
        },
        {
            desc: "3. Set up the integral for the conditional expectation $E[X|Y=y]$ using the derived conditional density:",
            correct: "$E[X|Y=y] = \\int_{0}^{\\infty} x \\cdot y e^{-yx} dx$",
            wrong: "$E[X|Y=y] = \\int_{0}^{\\infty} y e^{-yx} dx$",
            error: "To compute the expected value of $X$, you must include the factor of $x$ inside the integration framework.",
            proof: "$E[X|Y=y] = \\int_{0}^{\\infty} x \\cdot y e^{-yx} dx$"
        },
        {
            desc: "4. Evaluate the expectation integral using integration by parts or known properties of the Exponential distribution:",
            correct: "$E[X|Y=y] = \\frac{1}{y}$",
            wrong: "$E[X|Y=y] = y$",
            error: "The mean of an Exponential distribution with rate parameter $y$ is its reciprocal, $\\frac{1}{y}$.",
            proof: "$E[X|Y=y] = \\frac{1}{y} \\implies E[X|Y] = \\frac{1}{Y}$"
        },
        {
            desc: "5. State the density function $f_Y(y)$ for the random parameter $Y \\sim \\chi^2(1)$ for $y > 0$:",
            correct: "$f_Y(y) = \\frac{1}{\\sqrt{2\\pi y}} e^{-y/2}$",
            wrong: "$f_Y(y) = e^{-y}$",
            error: "The standard $\\chi^2(1)$ density is a special case of the Gamma distribution given by $\\frac{1}{\\sqrt{2\\pi y}} e^{-y/2}$.",
            proof: "$Y \\sim \\chi^2(1) \\implies f_Y(y) = \\frac{1}{\\sqrt{2\\pi y}} e^{-y/2} \\quad \\text{for } y > 0$"
        },
        {
            desc: "6. Exemplify the expression by finding the explicit value when given the condition $Y = 2$:",
            correct: "$E[X|Y=2] = \\frac{1}{2} = 0.5$",
            wrong: "$E[X|Y=2] = \\frac{1}{\\sqrt{4\\pi}} e^{-1}$",
            error: "The conditional expectation mapping depends entirely on $y$ from step 4 ($1/y$). Substitute $y = 2$ directly into $\\frac{1}{y}$.",
            proof: "$E[X|Y=2] = \\frac{1}{2} = 0.5 \\quad \\text{(Exemplified)}$"
        }
    ];

    let current = 0;
    let correctPos = 0;

    function start() {
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        document.getElementById('proof-board').classList.remove('hidden');
        render();
    }

    function render() {
        const s = steps[current];
        correctPos = Math.floor(Math.random() * 2);
        document.getElementById('step-desc').innerHTML = s.desc;
        document.getElementById('choice-' + correctPos).innerHTML = s.correct;
        document.getElementById('choice-' + (1 - correctPos)).innerHTML = s.wrong;
        document.querySelectorAll('.branch').forEach(el => el.className = 'branch');
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        MathJax.typesetPromise();
    }

    function check(index) {
        const s = steps[current];
        const fb = document.getElementById('feedback');
        const selected = document.getElementById('choice-' + index);
        fb.style.display = 'block';
        if (index === correctPos) {
            selected.className = 'branch correct';
            fb.innerHTML = "✓ <strong>Correct!</strong>";
            fb.style.color = "#27ae60"; fb.style.borderColor = "#2ecc71"; fb.style.backgroundColor = "#eafaf1";
            document.getElementById('next-btn').classList.remove('hidden');
        } else {
            selected.className = 'branch wrong';
            fb.innerHTML = "✗ <strong>Mistake:</strong> " + s.error;
            fb.style.color = "#c0392b"; fb.style.borderColor = "#e74c3c"; fb.style.backgroundColor = "#fff5f5";
        }
        MathJax.typesetPromise([fb]);
    }

    function next() {
        const board = document.getElementById('accumulated-steps');
        const newLine = document.createElement('div');
        newLine.className = 'proof-line';
        newLine.innerHTML = steps[current].proof;
        board.appendChild(newLine);
        current++;
        if (current < steps.length) { render(); }
        else {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('completion').classList.remove('hidden');
        }
        MathJax.typesetPromise([board]);
        document.getElementById('progress').style.width = (current / steps.length * 100) + "%";
    }
</script>
</body>
</html>
